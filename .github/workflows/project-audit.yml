name: Project audit (static)

# Chạy kiểm tra tĩnh trên mã nguồn Unity mà KHÔNG cần cài Unity Editor.
# Giai đoạn 1 (nay): chỉ báo cáo, không chặn PR (continue-on-error).
# Giai đoạn 2 (sau T-101/T-201): bỏ `continue-on-error` để biến thành gate bắt buộc.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static project audit
        run: python3 Tools/check_project.py --json audit-report.json

      - name: Summary
        if: always()
        run: |
          echo "### Static audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 Tools/check_project.py | tail -30 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          if-no-files-found: ignore

# Ghi chú: công việc nặng hơn (compile + Play Mode test) cần Unity License và
# self-hosted runner có Unity 6000.5.7f1 — xem T-001/T-601 trong docs/ANTIGRAVITY_BACKLOG.md
